services:
  web:
    build: .
    image: gestiolibra-web:latest
    container_name: gestiolibra-web
    restart: unless-stopped
    ports:
      - "8083:80"
    networks:
      - stack-net
    depends_on:
      - auth

  auth:
    build: ./auth
    image: gestiolibra-web-auth:latest
    container_name: gestiolibra-web-auth
    restart: unless-stopped
    environment:
      - DOCS_AUTH_SECRET=${DOCS_AUTH_SECRET:-}
      - DOCS_SESSION_SECRET=${DOCS_SESSION_SECRET:-gestiolibra-docs-secret-change-me}
      - APEX_DOMAIN=${APEX_DOMAIN:-gestiolibra.com.ar}
    networks:
      - stack-net

networks:
  stack-net:
    external: true
    name: stack_stack-net
